name: Test Homework 0

on:
  push:
    paths:
      - 'homeworks/hw0/**'
  workflow_dispatch:

jobs:
  test_homework0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run tests
        run: |
          cd homeworks/hw0/
          uv run python -m unittest tests/*.py
